name: YouTube Content Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (e.g., The Bronze Age Collapse)'
        required: true
        default: 'The Bronze Age Collapse'
        type: string
      mode:
        description: 'Run Mode'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - automatic
      duration:
        description: 'Video Length in Seconds'
        required: false
        default: '60'
        type: string
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "google-genai>=1.0.0" \
            "moviepy>=2.0.0" \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            edge-tts \
            requests

      - name: Generate Credential Files from GitHub Secrets
        env:
          CLIENT_SECRET_VAL: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_VAL: ${{ secrets.TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_SECRET_VAL" ]; then
            echo "::error::CLIENT_SECRET_JSON secret is empty"
            exit 1
          fi
          if [ -z "$TOKEN_VAL" ]; then
            echo "::error::TOKEN_JSON secret is empty"
            exit 1
          fi
          printf '%s' "$CLIENT_SECRET_VAL" > client_secret.json
          printf '%s' "$TOKEN_VAL" > token.json
          chmod 600 client_secret.json token.json
          python - <<'PY'
          import json
          for f in ("client_secret.json", "token.json"):
              with open(f) as fh:
                  json.load(fh)
              print(f"{f}: valid JSON")
          PY

      - name: Run Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'The Bronze Age Collapse' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'automatic' }}
          DURATION: ${{ github.event.inputs.duration || '60' }}
        run: |
          python app.py

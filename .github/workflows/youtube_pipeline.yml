name: YouTube Content Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Mode'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - automatic
      content_type:
        description: 'Content Type (for Manual Mode)'
        required: false
        default: 'Educational Explainer'
        type: choice
        options:
          - Educational Explainer
          - Tech News
          - Motivation Quote
      duration:
        description: 'Video Length in Seconds'
        required: false
        default: '15'
        type: string
  schedule:
    - cron: '0 0 * * *' # Optional: Runs automatically every day at UTC 00:00

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ImageMagick/MoviePy support)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-generativeai moviepy

      - name: Generate Credential Files from GitHub Secrets
        env:
          CLIENT_SECRET_VAL: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_VAL: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET_VAL" > client_secret.json
          echo "$TOKEN_VAL" > token.json

      - name: Run Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ github.event.inputs.mode || 'automatic' }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'Educational Explainer' }}
          DURATION: ${{ github.event.inputs.duration || '15' }}
        run: |
          python app.py
